feeds:
  testfeed:
    name: Test Feed
    description: Test Feed Description
    gtfs:
      static:
        url: http://127.0.0.1:3123/feeds/gtfs-feed.zip
        headers:
          Authorization: fake-auth
      rtTripUpdates:
        url: http://127.0.0.1:3123/gtfs-rt/trip-updates
        headers:
          Authorization: fake-auth
  testfeed2:
    name: Test Feed 2
    description: Test Feed 2 Description
    gtfs:
      static:
        url: http://127.0.0.1:3123/feeds/gtfs-feed-2.zip
        headers:
          Authorization: fake-auth
  farfuturefeed:
    name: Far Future Feed
    description: A feed with service dates far in the future
    gtfs:
      static:
        url: http://127.0.0.1:3123/feeds/gtfs-feed-far-future.zip
        headers:
          Authorization: fake-auth
  feed-with-hyphen:
    name: Feed with Hyphen
    description: A feed with a hyphen in the name
    gtfs:
      static:
        url: http://127.0.0.1:3123/feeds/gtfs-feed-2.zip
        headers:
          Authorization: fake-auth
  # A feed behind NJ TRANSIT's token-authenticated, POST-only API. The anchor
  # below is the ergonomics this shape is meant to have: credentials declared
  # once and referenced from both the static and realtime entries.
  njtfeed:
    name: NJT Style Feed
    description: Token-authenticated POST feed
    gtfs:
      static:
        url: http://127.0.0.1:3123/njt/getGTFS
        auth: &njtauth
          provider: njtransit
          api: rail
          baseUrl: http://127.0.0.1:3123/njt
          # Relative, so they resolve through CREDENTIALS_DIRECTORY exactly as
          # they would under systemd LoadCredential.
          usernameFile: username.txt
          passwordFile: password.txt
          dailyTokenBudget: 3
      rtTripUpdates:
        url: http://127.0.0.1:3123/njt/getTripUpdates
        auth: *njtauth
  # Same fixture as testfeed, but opted into block delay propagation so the
  # behaviour can be exercised without changing any other feed's expectations.
  blockfeed:
    name: Block Propagation Feed
    description: A feed that infers delays across vehicle blocks
    gtfs:
      quirks:
        propagateBlockDelays: true
      static:
        url: http://127.0.0.1:3123/feeds/gtfs-feed.zip
        headers:
          Authorization: fake-auth
      rtTripUpdates:
        url: http://127.0.0.1:3123/gtfs-rt/trip-updates
        headers:
          Authorization: fake-auth
